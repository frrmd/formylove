<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Made For kayla 🎁</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@600&display=swap" rel="stylesheet">
    <style>
        /* ==================== GLOBAL STYLES ==================== */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: black; overflow: hidden; font-family: 'Poppins', sans-serif;
        }

        canvas { position: absolute; top: 0; left: 0; z-index: 1; }

        .layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 10; pointer-events: none;
        }

        /* ==================== PHASE 1: TEXT SEQUENCE ==================== */
        #text-container { font-size: 50px; color: #ff69b4; text-shadow: 0 0 20px #ff1493; text-align: center; opacity: 0; transition: opacity 0.3s; }
        .show-text { opacity: 1 !important; }

        /* ==================== PHASE 2: STAR & GIF ==================== */
        #gif-container img { max-width: 200px; opacity: 0; transition: opacity 1s; }

        /* ==================== PHASE 3: THE BOOK ==================== */
        #book-container {
            perspective: 1200px; display: none; width: 90%; max-width: 400px;
            height: 60vh; max-height: 500px; pointer-events: auto; z-index: 20;
        }
        .book {
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
        }
        .page {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            background: white; border-radius: 10px; box-shadow: inset 0 0 20px rgba(0,0,0,0.1), 0 0 15px rgba(255,255,255,0.2);
            transform-origin: left center; transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box; cursor: pointer;
            backface-visibility: hidden;
        }
        .page img { width: 100%; max-height: 60%; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .page p { font-family: 'Dancing Script', cursive; font-size: 24px; color: #333; text-align: center; margin:0;}
        .page-hint { position: absolute; bottom: 10px; right: 20px; font-size: 12px; color: #888; }
        
        .flipped { transform: rotateY(-180deg); }

        /* ==================== PHASE 4: HEART SHAPE ==================== */
        #heart-container { display: none; z-index: 30; pointer-events: auto; }
        .heart-photo {
            position: absolute; width: 40px; height: 40px; border-radius: 5px;
            background-size: cover; background-position: center;
            box-shadow: 0 0 10px rgba(255,105,180,0.5); border: 2px solid white;
            transition: all 1.5s ease-in-out; opacity: 0;
            transform: translate(-50%, -50%) scale(0);
        }

        /* Tombol Mulai */
        #start-btn {
            padding: 15px 30px; font-size: 18px; border: none; border-radius: 25px;
            background: #ff69b4; color: white; cursor: pointer; pointer-events: auto;
            z-index: 100; box-shadow: 0 0 20px rgba(255,105,180,0.6);
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="layer" id="ui-layer">
        <button id="start-btn" onclick="startExperience()">🎁</button>
    </div>

    <div class="layer" id="text-layer">
        <div id="text-container"></div>
    </div>

    <div class="layer" id="gif-layer">
        <div id="gif-container"><img src="https://media.tenor.com/pClN7HhxPTEAAAAM/party-celebration.gif" id="bday-gif"></div>
    </div>

    <div class="layer">
        <div id="book-container">
            <div class="book" id="the-book">
                </div>
        </div>
    </div>

    <div class="layer" id="heart-container"></div>

    <audio id="bgm" src="https://cdn.jsdelivr.net/gh/tuanitpro/happy-birthday/hap-py-birth-day-to-you.mp3" loop></audio>

    <script>
        /* ==============================================================
           DATA KONTEN - SILAKAN GANTI LINK DI BAWAH INI DENGAN FOTOMU!
           Karena kamu pakai folder lokal, tulis nama foldernya dan nama filenya.
           Contoh: "foto/foto-kamu.jpg"
           ============================================================== */
        const bookPagesData = [
            // 👇 GANTI DI SINI: Ubah link http dengan folder/namafile foto kamu
            { img: "img/1.png", text: "Happy Birthday Sayang 💕" },
            { img: "img/2.png", text: "As long as you're smilin. I'm happy." },
            { img: "img/image.png", text: "Stay happy, my love ✨" }
        ];

        // Daftar foto untuk animasi bentuk hati di akhir (bisa sama dengan di atas)
        const heartPhotosData = [
            // 👇 GANTI DI SINI JUGA: Hapus link http, ganti dengan nama file lokal
            "img/4.png",
            "img/5.png",
            "img/3.png",
            // Kamu bisa tambahkan link foto lebih banyak di sini
        ];

        /* ==================== SYSTEM LOGIC ==================== */
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let currentEffect = null;

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        /* --- MATRIX RAIN EFFECT --- */
        let letters = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        let fontSize = 16, columns, drops;
        function initMatrix() {
            columns = canvas.width / fontSize;
            drops = []; for(let x = 0; x < columns; x++) drops[x] = 1;
            currentEffect = setInterval(drawMatrix, 50);
        }
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff1493'; ctx.font = fontSize + 'px monospace';
            for(let i = 0; i < drops.length; i++) {
                let text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }

        /* --- STARS EFFECT --- */
        let stars = [];
        function initStars() {
            clearInterval(currentEffect);
            ctx.fillStyle = 'black'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            stars = []; for(let i=0; i<150; i++) stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*2 });
            currentEffect = setInterval(drawStars, 30);
        }
        function drawStars() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            stars.forEach(star => {
                ctx.beginPath(); ctx.arc(star.x, star.y, star.s, 0, Math.PI*2); ctx.fill();
                star.y += star.s; if(star.y > canvas.height) star.y = 0;
            });
        }

        /* --- SEQUENCE ALUR KEJUTAN --- */
        const sequence = ['3', '2', '1', 'HAPPY', 'BIRTHDAY', 'TO', 'Kayla Rihadatul Haniyah', '❤️'];
        
        function startExperience() {
            document.getElementById('ui-layer').style.display = 'none';
            document.getElementById('bgm').play(); // Mulai lagu
            initMatrix(); // Mulai Matrix Pink
            runTextSequence();
        }

        function runTextSequence() {
            const textEl = document.getElementById('text-container');
            let i = 0;
            
            function nextText() {
                if (i < sequence.length) {
                    textEl.innerText = sequence[i];
                    textEl.classList.add('show-text');
                    
                    setTimeout(() => {
                        textEl.classList.remove('show-text');
                        setTimeout(() => { i++; nextText(); }, 300); // Jeda sebelum teks berikutnya
                    }, 800); // Lama teks tampil
                } else {
                    transitionToStars();
                }
            }
            nextText();
        }

        function transitionToStars() {
            initStars(); // Ubah background jadi bintang
            const gif = document.getElementById('bday-gif');
            gif.style.opacity = '1';
            
            // Tampilkan GIF sebentar, lalu lanjut ke Buku
            setTimeout(() => {
                gif.style.opacity = '0';
                setTimeout(showBook, 1000);
            }, 3000);
        }

        /* --- BOOK LOGIC --- */
        let currentPage = 0;
        function showBook() {
            const bookContainer = document.getElementById('book-container');
            const theBook = document.getElementById('the-book');
            bookContainer.style.display = 'block';

            // Generate halaman dari data
            // Kita reverse agar halaman pertama ada di tumpukan paling atas (z-index tertinggi)
            [...bookPagesData].reverse().forEach((data, index) => {
                let realIndex = bookPagesData.length - 1 - index;
                let page = document.createElement('div');
                page.className = 'page';
                page.style.zIndex = index + 1;
                page.innerHTML = `
                    <img src="${data.img}" alt="Foto">
                    <p>${data.text}</p>
                    <div class="page-hint">Klik untuk lanjut ➔</div>
                `;
                
                page.onclick = () => {
                    page.classList.add('flipped');
                    currentPage++;
                    if(currentPage >= bookPagesData.length) {
                        setTimeout(formHeartShape, 800);
                    }
                };
                theBook.appendChild(page);
            });
        }

        /* --- HEART SHAPE LOGIC --- */
        function formHeartShape() {
            document.getElementById('book-container').style.display = 'none';
            const heartContainer = document.getElementById('heart-container');
            heartContainer.style.display = 'block';

            // Rumus matematika untuk bentuk hati
            const totalPhotos = 35; 
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const scale = Math.min(window.innerWidth, window.innerHeight) / 40; // Sesuaikan ukuran layar

            for(let i=0; i<totalPhotos; i++) {
                let t = i * (Math.PI * 2) / totalPhotos;
                // Formula Parametrik Hati
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                
                let posX = centerX + (x * scale);
                let posY = centerY + (y * scale);

                let photoDiv = document.createElement('div');
                photoDiv.className = 'heart-photo';
                // Ambil foto secara acak dari array
                photoDiv.style.backgroundImage = `url(${heartPhotosData[i % heartPhotosData.length]})`;
                
                // Posisi awal di tengah
                photoDiv.style.left = centerX + 'px';
                photoDiv.style.top = centerY + 'px';
                
                heartContainer.appendChild(photoDiv);

                // Animasi menyebar ke bentuk hati dengan delay
                setTimeout(() => {
                    photoDiv.style.opacity = '1';
                    photoDiv.style.left = posX + 'px';
                    photoDiv.style.top = posY + 'px';
                    photoDiv.style.transform = `translate(-50%, -50%) scale(1) rotate(${(Math.random()-0.5)*30}deg)`;
                }, 100 * i);
            }
        }
    </script>
</body>
</html>
